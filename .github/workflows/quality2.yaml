name: Lint & Format avec Ruff et UV 2
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["step-06-git-workflow"]

jobs:
  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installation de uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Configuration de Python
        run: uv python install 3.12

      - name: Installation des dépendances (avec uv)
        run: uv sync --dev

      - name: Linting avec Ruff
        run: uv run ruff check .

      - name: Vérification du formatage avec Ruff
        run: uv run ruff format --check .

      - name: Tests avec Pytest
        run: uv run pytest
